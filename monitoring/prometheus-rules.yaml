apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flask-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: flask.rules
    rules:
    - alert: HighResponseLatency
      expr: |
        histogram_quantile(
          0.95,
          sum(rate(flask_request_duration_seconds_bucket[5m])) by (le)
        ) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High response latency"
        description: "P95 response time is greater than 500ms for more than 2 minutes."
    - alert: FlaskAppDown
      expr: absent(up{job="my-python-app-flask-chart"})
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Flask application is down"
        description: "No Flask application targets are being scraped."