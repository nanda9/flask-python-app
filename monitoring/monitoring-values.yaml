alertmanager:
  enabled: true

  config:
    global:
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_from: "nandakumar.jraju@gmail.com"
      smtp_auth_username: "nandakumar.jraju@gmail.com"
      smtp_require_tls: true

    route:
      receiver: gmail
      group_by:
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: "null"

    receivers:
      - name: gmail
        email_configs:
          - to: "nandakumar.jraju@gmail.com"
            send_resolved: true

      - name: "null"

grafana:
  env:
    GF_SMTP_PASSWORD: $__file{/etc/secrets/smtp-password/smtp-password}

  extraSecretMounts:
    - name: grafana-smtp
      secretName: grafana-smtp
      defaultMode: 0440
      mountPath: /etc/secrets/smtp-password
      readOnly: true

  persistence:
    enabled: true
    type: sts
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  grafana.ini:
    smtp:
      enabled: true
      host: smtp.gmail.com:587
      user: nandakumar.jraju@gmail.com
      password: $__env{GF_SMTP_PASSWORD}
      from_address: nandakumar.jraju@gmail.com
      from_name: Grafana
      startTLS_policy: Mandatory

  additionalDataSources:
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: us-east-1