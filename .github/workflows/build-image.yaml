name: Build and Push Docker Image to ECR

on:
  push:
    branches: ["main"]
    
permissions:
  id-token: write
  contents: write   # required so the workflow can git push back

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watchtower
  ECR_REGISTRY: 405804178912.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405804178912:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      # 3. Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 4. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      # 5. Set image tag 
      - name: Set image tag 
        run: | 
          echo "IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV" 

      # 6. Build Docker image 
      - name: Build Docker image
        run: |
          echo "Building image: $IMAGE" docker build -t "$IMAGE" . 
      
      # 7. Push Docker image to ECR 
      - name: Push Docker image
        run: | 
          echo "Pushing image: $IMAGE" docker push "$IMAGE"

      # 8. Update Helm image tag
      - name: Update Helm image tag
        run: |
          echo "Updating Helm values.yaml"

          sed -i "s|tag: .*|tag: ${{ github.sha }}|g" flask-chart/values.yaml

          cat flask-chart/values.yaml


      # 9. Commit Helm change
      - name: Commit Helm update
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add flask-chart/values.yaml

          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes"

          git push
