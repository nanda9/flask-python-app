name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: watchtower
  ECR_REGISTRY: 405804178912.dkr.ecr.us-east-1.amazonaws.com
  IMAGE: 405804178912.dkr.ecr.us-east-1.amazonaws.com/watchtower:${{ github.sha }}

jobs:

  # ============================================================
  # CI
  # ============================================================

  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          python -m pytest -v


  # ============================================================
  # Docker Build + Security + ECR
  # ============================================================

  build:
    name: Build Scan and Push Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405804178912:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          echo "Building image:"
          echo "$IMAGE"

          docker build \
            -t "$IMAGE" \
            .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push Docker image
        run: |
          echo "Pushing image:"
          echo "$IMAGE"

          docker push "$IMAGE"


  # ============================================================
  # GitOps
  # ============================================================

  update-manifest:
    name: Update Helm Image Tag
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Helm image tag
        run: |
          echo "Updating Helm image tag to:"
          echo "${GITHUB_SHA}"

          sed -i "s|tag: .*|tag: ${GITHUB_SHA}|g" flask-chart/values.yaml

          echo "Updated values.yaml:"
          cat flask-chart/values.yaml

      - name: Commit Helm update
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add flask-chart/values.yaml

          git diff --cached

          git commit \
            -m "chore: update image tag to ${GITHUB_SHA} [skip ci]" \
            || echo "No changes to commit"

          git push