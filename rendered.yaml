---
# Source: flask-chart/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: watchtower-flask-chart-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-chart
      app.kubernetes.io/instance: watchtower
---
# Source: flask-chart/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-sa
  labels:
    helm.sh/chart: flask-chart-0.1.0
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true

---
# Source: flask-chart/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: flask-secret
  namespace: default
  labels:
    app: flask
type: Opaque
stringData:
  DEMO_PASSWORD: "password"
---
# Source: flask-chart/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: flask-config
  namespace: default
  labels:
    app: flask
data:
  APP_NAME: "DevOps CI/CD Dashboard"
  APP_ENV: "Kubernetes"
  COMPANY: "Nandakumar DevOps"
  NAMESPACE: "dev"

---
# Source: flask-chart/templates/flask-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flask-pod-reader
  namespace: default

rules:
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list
---
# Source: flask-chart/templates/flask-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flask-pod-reader-binding
  namespace: default

subjects:
- kind: ServiceAccount
  name: flask-sa
  namespace: default

roleRef:
  kind: Role
  name: flask-pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# Source: flask-chart/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: watchtower-flask-chart
  labels:
    helm.sh/chart: flask-chart-0.1.0
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower

---
# Source: flask-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment

metadata:
  name: watchtower-flask-chart
  labels:
    helm.sh/chart: flask-chart-0.1.0
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm

spec:

  revisionHistoryLimit: 5

  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: flask-chart
      app.kubernetes.io/instance: watchtower

  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-chart
        app.kubernetes.io/instance: watchtower

    spec:

      serviceAccountName: flask-sa
      terminationGracePeriodSeconds: 30

      containers:

      - name: flask

        image: "405804178912.dkr.ecr.us-east-1.amazonaws.com/watchtower:4b467848c43a050888ffc8c330a2db6b9c837c0d"

        imagePullPolicy: Always

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10

        ports:
          - name: http
            containerPort: 5000
            protocol: TCP


        envFrom:

        - configMapRef:
            name: flask-config

        - secretRef:
            name: flask-secret
        
        startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http
            periodSeconds: 10

        readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

        livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2

        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi

---
# Source: flask-chart/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: watchtower-flask-chart
  labels:
    helm.sh/chart: flask-chart-0.1.0
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: watchtower-flask-chart
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
# Source: flask-chart/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watchtower-flask-chart
  labels:
    helm.sh/chart: flask-chart-0.1.0
    app.kubernetes.io/name: flask-chart
    app.kubernetes.io/instance: watchtower
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb

  rules:
    -
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: watchtower-flask-chart
                port:
                  number: 80
